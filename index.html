
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bayelsa Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8bcfff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud,#help,#message,#footer{position:fixed;z-index:5;color:white;background:#071827df;border-radius:12px;padding:10px}
#hud{top:10px;left:10px;font-size:12px}
#hud strong{font-size:20px;color:#55ff9d}
#help{top:10px;right:10px;font-size:12px;max-width:155px}
#message{top:105px;left:50%;transform:translateX(-50%);text-align:center;width:max-content;max-width:88%;pointer-events:none}
#footer{bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;padding:5px 8px}
#controls{position:fixed;z-index:10;bottom:24px;left:12px;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:5px}
.ctrl,.action{color:white;background:#102c44dd;border:1px solid #ffffffaa;touch-action:none;user-select:none}
.ctrl{font-size:23px;border-radius:15px}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{position:fixed;right:12px;bottom:25px;z-index:10;display:flex;flex-direction:column;gap:9px}
.action{width:64px;height:58px;border-radius:16px;font-size:11px;font-weight:bold}
button:active{background:#008f72}
@media(min-width:750px){
#controls{left:25px;bottom:30px}
#actions{right:25px;bottom:30px}
#help{max-width:220px;font-size:14px}
}
</style>
</head>
<body>
<div id="hud">
<strong>🌴 BAYELSA LIFE</strong>
<div>3D CITY EXPLORER</div>
<div id="status">Loading world...</div>
<div id="position">Explore Bayelsa</div>
<div id="place">Outside</div>
</div>

<div id="help">
<b>HOW TO PLAY</b><br><br>
▲ Walk forward<br>
▼ Walk backward<br>
◀ Turn left<br>
▶ Turn right<br><br>
🏥 Visit the hospital<br>
🚪 Explore buildings
</div>

<div id="message">Welcome to Bayelsa Life!</div>

<div id="controls">
<button class="ctrl" id="up">▲</button>
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="down">▼</button>
<button class="ctrl" id="right">▶</button>
</div>

<div id="actions">
<button class="action" id="interact">ENTER / EXIT</button>
<button class="action" id="talk">TALK</button>
<button class="action" id="jump">JUMP</button>
<button class="action" id="camera">CAMERA</button>
</div>
<div id="footer">BAYELSA LIFE • 3D CITY PROTOTYPE</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ===== WORLD SETUP ===== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91d4ff);
scene.fog = new THREE.Fog(0x91d4ff,100,340);

const camera = new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,700
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe6f6ff,0x536343,2));

const sunlight=new THREE.DirectionalLight(0xfff1d5,2.1);
sunlight.position.set(70,100,40);
scene.add(sunlight);

function mat(color,roughness=0.9){
return new THREE.MeshStandardMaterial({color,roughness});
}

function box(parent,x,y,z,w,h,d,color){
const obj=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),mat(color)
);
obj.position.set(x,y+h/2,z);
parent.add(obj);
return obj;
}

/* ===== CITY GROUND AND ROADS ===== */
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
mat(0x57994d)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.08;
scene.add(ground);

const road=mat(0x343b43);
const yellow=mat(0xffe39a);
const concrete=mat(0xc8c4b8);

function roadBox(x,z,w,d){
box(scene,x,0.01,z,w,0.12,d,0x343b43);
}

roadBox(0,0,14,420);
roadBox(-70,0,12,420);
roadBox(70,0,12,420);
roadBox(0,0,420,14);
roadBox(0,-70,420,12);
roadBox(0,70,420,12);

for(let z=-205;z<210;z+=10){
box(scene,0,0.08,z,0.2,0.025,4,0xffe39a);
box(scene,-70,0.08,z,0.15,0.025,3,0xffe39a);
box(scene,70,0.08,z,0.15,0.025,3,0xffe39a);
}
for(let x=-205;x<210;x+=10){
box(scene,x,0.08,0,4,0.025,0.2,0xffe39a);
box(scene,x,0.08,-70,3,0.025,0.15,0xffe39a);
box(scene,x,0.08,70,3,0.025,0.15,0xffe39a);
}

for(const x of [-9,9,-79,-61,61,79]){
box(scene,x,0.02,0,2,0.17,420,0xc8c4b8);
}
for(const z of [-9,9,-79,-61,61,79]){
box(scene,0,0.02,z,420,0.17,2,0xc8c4b8);
}

/* ===== BUILDINGS ===== */
const buildingColors=[
0xe6d9c6,0xe5edf0,0xc6d9e1,0xe6c69e,
0xc0cdd0,0xd7e1ce,0xf1e9dd,0xc9b9a5
];

function building(x,z,w,d,h,color){
const g=new THREE.Group();
g.position.set(x,0,z);
scene.add(g);

box(g,0,0,0,w,h,d,color);
box(g,0,h,0,w+0.3,0.3,d+0.3,0x7c858a);

// Front-facing windows
for(let yy=2;yy<h-1;yy+=3){
for(let xx=-w/2+1.5;xx<w/2-0.5;xx+=3){
box(g,xx,yy,-d/2-0.04,1.15,1.2,0.08,0x78c5e5);
}
}
return g;
}

for(let bx=-3;bx<=3;bx++){
for(let bz=-3;bz<=3;bz++){
if(bx===0||bz===0||bx===1||bz===1)continue;
building(
bx*45,bz*45,
12+Math.random()*10,
12+Math.random()*10,
9+Math.random()*22,
buildingColors[Math.floor(Math.random()*buildingColors.length)]
);
}
}

/* ===== HOSPITAL EXTERIOR ===== */
const hospital=new THREE.Group();
hospital.position.set(112,0,10);
scene.add(hospital);

box(hospital,0,0,0,30,14,22,0xeef3f4);
box(hospital,0,14,0,31,0.4,23,0x7db6cc);
box(hospital,0,7,-11.2,24,1.5,0.3,0x155889);
box(hospital,0,2,-11.5,7,4,0.25,0x6bc9ee);

// Red medical cross
box(hospital,0,11,-11.6,1.5,4,0.25,0xd92535);
box(hospital,0,11,-11.65,4,1.5,0.25,0xd92535);

for(let x=-12;x<=12;x+=4){
for(let y=3;y<=11;y+=4){
box(hospital,x,y,-11.3,2,1.7,0.1,0x82cce8);
}
}

function textSign(label,x,y,z,width=12){
const c=document.createElement('canvas');
c.width=1024;c.height=128;
const ctx=c.getContext('2d');
ctx.fillStyle='#12446a';ctx.fillRect(0,0,1024,128);
ctx.fillStyle='white';
ctx.font='bold 65px Arial';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText(label,512,64);
const texture=new THREE.CanvasTexture(c);
const m=new THREE.Mesh(
new THREE.PlaneGeometry(width,1.5),
new THREE.MeshBasicMaterial({map:texture})
);
m.position.set(x,y,z);
scene.add(m);
}
textSign('BAYELSA CITY HOSPITAL',112,12,-2,22);

/* ===== SHOPS ===== */
function shop(x,z,color){
const g=new THREE.Group();
g.position.set(x,0,z);
scene.add(g);
box(g,0,0,0,12,5,9,color);
box(g,0,5,0,12,0.35,9,0x8c482c);
box(g,0,2.8,-4.7,9,0.9,0.15,0x12605c);
}
shop(-25,12,0xe3a258);
shop(27,94,0xe6d187);
shop(-27,-93,0xd7b5a0);

/* ===== TREES ===== */
function tree(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(0.2,0.38,3,7),mat(0x70472a));
trunk.position.set(x,1.5,z);
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(2,8,7),mat(0x258043));
leaves.position.set(x,4,z);
scene.add(leaves);
}
for(let x=-190;x<=190;x+=18){
for(const z of [-13,13,-83,-57,57,83]){
if(Math.abs(x)>14)tree(x,z);
}
}

/* ===== PLAYER CHARACTER ===== */
const player=new THREE.Group();
scene.add(player);

const torso=new THREE.Mesh(
new THREE.CapsuleGeometry(0.48,0.8,4,8),mat(0x1976bd));
torso.position.y=1.25;
player.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.34,12,10),mat(0x8d573b));
head.position.y=2.15;
player.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(0.35,12,8,0,Math.PI*2,0,Math.PI/2),
mat(0x171719));
hair.position.y=2.34;
player.add(hair);

const legs=[];
const arms=[];
for(const x of [-0.2,0.2]){
const leg=new THREE.Mesh(
new THREE.BoxGeometry(0.22,0.75,0.25),mat(0x29313a));
leg.position.set(x,0.38,0);
player.add(leg);
legs.push(leg);

const arm=new THREE.Mesh(
new THREE.BoxGeometry(0.18,0.7,0.2),mat(0x1976bd));
arm.position.set(x*2,1.3,0);
player.add(arm);
arms.push(arm);
}
player.position.set(0,0,15);

/* ===== INTERIOR WORLD ===== */
let inside=false;
let currentBuilding='';
let savedPosition=new THREE.Vector3();
const interior=new THREE.Group();
interior.position.set(1000,0,1000);
scene.add(interior);
const indoorPeople=[];

function roomBox(x,y,z,w,h,d,color){
return box(interior,x,y,z,w,h,d,color);
}

function indoorPerson(x,z,color,role){
const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.29,0.65,4,8),mat(color));
body.position.y=1.05;
g.add(body);

const face=new THREE.Mesh(
new THREE.SphereGeometry(0.23,12,10),mat(0x8d573b));
face.position.y=1.75;
g.add(face);

g.position.set(x,0,z);
interior.add(g);
indoorPeople.push({
g,x,z,phase:Math.random()*6,role
});
return g;
}

function bed(x,z){
roomBox(x,0.35,z,2.6,0.18,4,0x87949d);
roomBox(x,0.65,z,2.4,0.35,3.8,0xffffff);
roomBox(x,0.9,z-1.3,1.25,0.2,0.7,0xdcecf2);

// Patient lying down
const patient=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(0.85,0.3,1.8),mat(0x86c9e8));
body.position.set(x,1.05,z+0.1);
patient.add(body);

const face=new THREE.Mesh(
new THREE.SphereGeometry(0.25,12,10),mat(0x8d573b));
face.position.set(x,1.12,z-0.95);
patient.add(face);

interior.add(patient);

// IV stand and fluid bag
roomBox(x+1.55,0,z-1,0.08,2.4,0.08,0x9aa5ac);
roomBox(x+1.55,2,z-1,0.45,0.55,0.12,0x86d9ff);

// Bedside monitor
roomBox(x-1.55,1.2,z-0.7,0.55,0.8,0.35,0x303b47);
roomBox(x-1.55,1.4,z-0.9,0.38,0.3,0.06,0x51ff9a);
}

function buildRoom(kind){
interior.clear();
indoorPeople.length=0;

const isHospital=kind==='hospital';
const wall=0xeeeae0;

// Floor, ceiling and walls
roomBox(0,-0.15,0,18,0.3,18,
isHospital?0xe4eded:0xc9a47d);
roomBox(0,5.5,0,18,0.2,18,0xf5f4ed);

roomBox(-9,0,0,0.3,5.5,18,wall);
roomBox(9,0,0,0.3,5.5,18,wall);
roomBox(0,0,-9,18,5.5,0.3,wall);

// Front wall leaves a doorway opening
roomBox(-5.5,0,9,7,5.5,0.3,wall);
roomBox(5.5,0,9,7,5.5,0.3,wall);
roomBox(0,3.7,9,4,1.8,0.3,wall);

// Door frame
roomBox(-2.1,0,8.8,0.15,3.8,0.25,0x79502e);
roomBox(2.1,0,8.8,0.15,3.8,0.25,0x79502e);
roomBox(0,3.8,8.8,4.3,0.15,0.25,0x79502e);

if(isHospital){
  // Reception station
  roomBox(0,0.7,-5,5.5,1.4,1.3,0x8c684a);
  roomBox(0,1.45,-5,5.7,0.12,1.5,0xffffff);

  // Hospital waiting chairs
  for(const x of [-5,-2,2,5]){
    roomBox(x,0.5,-1.8,1.2,0.7,0.8,0x3186b8);
    roomBox(x,0.95,-2.15,1.2,0.8,0.2,0x3186b8);
  }

  // Two hospital beds with lying patients
  bed(-5,3);
  bed(4,3);

  // Medical cabinet
  roomBox(7,1.4,2,1.2,2.8,1.2,0xffffff);

  // Doctors, nurses and visitors
  indoorPerson(-1,-4,0x1976d2,'Receptionist');
  indoorPerson(3,-1,0x20a36a,'Nurse');
  indoorPerson(-6,0,0x9b6bc0,'Visitor');
  indoorPerson(5,5,0x1976d2,'Doctor');

}else{
  // Market/shop interior
  roomBox(0,0.7,-5,5.5,1.4,1.3,0x8c542e);

  for(const x of [-6,6]){
    for(const z of [-2,1,4]){
      roomBox(x,1.3,z,1,2.6,1.8,0x99643c);
      for(const y of [0.7,1.5,2.3]){
        roomBox(x,y,z,1.2,0.1,2,0xf2d17b);
      }
    }
  }

  indoorPerson(0,-3,0x21966a,'Shopkeeper');
  indoorPerson(3,1,0xd5a126,'Customer');
  indoorPerson(-3,3,0x8c65b7,'Customer');
}
}

function enterBuilding(kind,name){
savedPosition.copy(player.position);
inside=true;
currentBuilding=name;
buildRoom(kind);

// Interior is centred at world coordinate (1000,1000)
player.position.set(1000,0,1006);
player.rotation.y=0;
notify('Welcome inside '+name+'! Explore the room.');
}

function exitBuilding(){
inside=false;
player.position.copy(savedPosition);
notify('You have returned to the city.');
}

/* ===== TRAFFIC ===== */
const cars=[];
const carColors=[0xe83f40,0x2369c8,0xe3aa39,0xeceff1,0x272e35,0x159a75];

function makeCar(x,z,color,axis,speed){
const g=new THREE.Group();
box(g,0,0.65,0,2,0.9,4,color);
box(g,0,1.3,-0.2,1.5,0.6,1.9,0x86c9e8);

for(const wx of [-1,1]){
for(const wz of [-1.25,1.25]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(0.3,0.3,0.18,10),
mat(0x151515));
wheel.rotation.z=Math.PI/2;
wheel.position.set(wx,0.35,wz);
g.add(wheel);
}
}
g.position.set(x,0,z);
scene.add(g);
cars.push({g,axis,speed});
}

for(let i=0;i<12;i++){
makeCar(i%2===0?-3:3,-185+i*32,
carColors[i%carColors.length],'z',
(i%2===0?1:-1)*(5+Math.random()*3));
}
for(let i=0;i<10;i++){
makeCar(-180+i*38,i%2===0?-73:-67,
carColors[(i+2)%carColors.length],'x',
(i%2===0?1:-1)*(5+Math.random()*3));
}

/* ===== OUTDOOR PEDESTRIANS ===== */
const people=[];
function makePerson(x,z,color){
const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(0.3,0.65,3,7),mat(color));
body.position.y=1.05;
g.add(body);

const face=new THREE.Mesh(
new THREE.SphereGeometry(0.23,8,7),mat(0x8d573b));
face.position.y=1.75;
g.add(face);

g.position.set(x,0,z);
scene.add(g);
people.push({
g,phase:Math.random()*6,
dx:Math.random()>0.5?1:-1
});
}
for(let i=0;i<22;i++){
makePerson(
(Math.random()>0.5?1:-1)*(12+Math.random()*14),
(Math.random()-0.5)*200,
[0xe5a32c,0x8b61bd,0x258a65,0xc34b42][i%4]
);
}

/* ===== INPUT CONTROLS ===== */
const keys={};
let cameraMode=0;
let jumpPower=0;
let elapsed=0;
let noticeUntil=0;

function setKey(key,value){
keys[key]=value;
}

const controlMap={
up:'ArrowUp',
down:'ArrowDown',
left:'ArrowLeft',
right:'ArrowRight'
};

for(const id in controlMap){
const el=document.getElementById(id);
const key=controlMap[id];

el.addEventListener('pointerdown',e=>{
e.preventDefault();
el.setPointerCapture(e.pointerId);
setKey(key,true);
});

function release(e){
e.preventDefault();
setKey(key,false);
}
el.addEventListener('pointerup',release);
el.addEventListener('pointercancel',release);
el.addEventListener('lostpointercapture',()=>{
setKey(key,false);
});
}

addEventListener('keydown',e=>{
const k=e.key.toLowerCase();
if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
e.preventDefault();
}
setKey(
k==='w'?'ArrowUp':
k==='s'?'ArrowDown':
k==='a'?'ArrowLeft':
k==='d'?'ArrowRight':e.key,true
);
});

addEventListener('keyup',e=>{
setKey(e.key,false);
setKey(e.key.toLowerCase(),false);
});

function notify(message){
const el=document.getElementById('message');
el.textContent=message;
el.style.display='block';
noticeUntil=performance.now()+3500;
}

document.getElementById('jump').onclick=()=>{
if(player.position.y<0.05)jumpPower=7;
};

document.getElementById('camera').onclick=()=>{
cameraMode=(cameraMode+1)%3;
notify(['Camera: Follow','Camera: Wide','Camera: Close'][cameraMode]);
};

/* ===== ENTER AND EXIT BUILDINGS ===== */
document.getElementById('interact').onclick=()=>{
if(inside){
if(player.position.z>1006.5 &&
player.position.x>997 &&
player.position.x<1003){
exitBuilding();
}else{
notify('Walk back to the doorway to exit.');
}
return;
}

const targets=[
{name:'Bayelsa City Hospital',x:112,z:10,kind:'hospital'},
{name:'City Market Shop',x:-25,z:12,kind:'shop'},
{name:'Shopping Centre',x:27,z:94,kind:'shop'}
];

let nearest=null;
let distance=Infinity;
for(const t of targets){
const d=Math.hypot(
player.position.x-t.x,player.position.z-t.z);
if(d<distance){distance=d;nearest=t;}
}

if(nearest&&distance<20){
enterBuilding(nearest.kind,nearest.name);
}else{
notify('Move close to the hospital or a shop first.');
}
};

/* ===== TALK TO CHARACTERS ===== */
document.getElementById('talk').onclick=()=>{
if(inside){
if(indoorPeople.length){
const p=indoorPeople.reduce((best,npc)=>{
const d=player.position.distanceTo(npc.g.position);
return d<best.d?{npc,d}:best;
},{npc:null,d:Infinity});

if(p.npc&&p.d<7){
notify(p.npc.role+': Hello! Welcome to '+currentBuilding+'.');
}else{
notify('Walk closer to someone to start a conversation.');
}
}
}else{
let nearest=null;
let dist=Infinity;
for(const p of people){
const d=player.position.distanceTo(p.g.position);
if(d<dist){dist=d;nearest=p;}
}
if(nearest&&dist<5){
notify('Hello there! Welcome to Bayelsa Life.');
}else{
notify('Find someone nearby to talk to.');
}
}
};

/* ===== COLLISION BOUNDARIES ===== */
function blocked(x,z){
if(inside){
return x<991||x>1009||z<991||z>1009;
}
return Math.abs(x)>205||Math.abs(z)>205;
}

/* ===== GAME LOOP ===== */
const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),0.04);
elapsed+=dt;

let forward=0;
if(keys.ArrowUp||keys.w||keys.W)forward+=1;
if(keys.ArrowDown||keys.s||keys.S)forward-=1;

let turning=0;
if(keys.ArrowLeft||keys.a||keys.A)turning+=1;
if(keys.ArrowRight||keys.d||keys.D)turning-=1;

// Rotate naturally; do not slide sideways.
player.rotation.y+=turning*2.5*dt;

if(forward!==0){
const yaw=player.rotation.y;
const dx=Math.sin(yaw)*forward*8*dt;
const dz=Math.cos(yaw)*forward*8*dt;

const nx=player.position.x+dx;
const nz=player.position.z+dz;

if(!blocked(nx,player.position.z))player.position.x=nx;
if(!blocked(player.position.x,nz))player.position.z=nz;

legs[0].rotation.x=Math.sin(elapsed*11)*0.65;
legs[1].rotation.x=-Math.sin(elapsed*11)*0.65;
arms[0].rotation.x=-Math.sin(elapsed*11)*0.45;
arms[1].rotation.x=Math.sin(elapsed*11)*0.45;
}else{
legs.forEach(l=>l.rotation.x=0);
arms.forEach(a=>a.rotation.x=0);
}

// Jump physics
if(jumpPower>0||player.position.y>0){
player.position.y+=jumpPower*dt;
jumpPower-=18*dt;
if(player.position.y<=0){
player.position.y=0;
jumpPower=0;
}
}

// Moving cars
if(!inside){
cars.forEach(car=>{
if(car.axis==='z'){
car.g.position.z+=car.speed*dt;
if(car.g.position.z>215)car.g.position.z=-215;
if(car.g.position.z<-215)car.g.position.z=215;
}else{
car.g.position.x+=car.speed*dt;
if(car.g.position.x>215)car.g.position.x=-215;
if(car.g.position.x<-215)car.g.position.x=215;
}
});

// Outdoor pedestrians
people.forEach(p=>{
p.phase+=dt*2;
p.g.position.x+=p.dx*dt*0.65;
p.g.position.z+=Math.sin(p.phase)*dt*0.45;
if(p.g.position.x>30)p.dx=-1;
if(p.g.position.x<-30)p.dx=1;
p.g.rotation.y=p.dx>0?Math.PI/2:-Math.PI/2;
});
}

// Indoor people move around the room
if(inside){
indoorPeople.forEach((p,i)=>{
p.phase+=dt*(0.4+i*0.08);
p.g.position.x=p.x+Math.sin(p.phase)*0.55;
p.g.position.z=p.z+Math.cos(p.phase*0.7)*0.4;
});
}

// Camera behind the character's facing direction
let height=5.5,back=8;
if(cameraMode===1){height=10;back=15;}
if(cameraMode===2){height=3;back=4.5;}

const yaw=player.rotation.y;
const target=new THREE.Vector3(
player.position.x-Math.sin(yaw)*back,
player.position.y+height,
player.position.z-Math.cos(yaw)*back
);
camera.position.lerp(target,1-Math.exp(-5*dt));
camera.lookAt(
player.position.x+Math.sin(yaw)*3,
player.position.y+1.4,
player.position.z+Math.cos(yaw)*3
);

document.getElementById('status').textContent=
inside?'Inside building':'Exploring the city';
document.getElementById('position').textContent=
'Position: '+Math.round(player.position.x)+', '+
Math.round(player.position.z);
document.getElementById('place').textContent=
inside?currentBuilding:'Outside • Bayelsa';

if(performance.now()>noticeUntil){
document.getElementById('message').style.display='none';
}

renderer.render(scene,camera);
}

camera.position.set(0,7,25);
camera.lookAt(0,1,15);

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

notify('Welcome to Bayelsa Life! Turn, walk and explore.');
animate();
</script>
</body>
</html>
