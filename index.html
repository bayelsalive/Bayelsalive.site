
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bayelsa Life 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;color:white;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#10251edb;border:1px solid #ffffff30;border-radius:13px;padding:10px;box-shadow:0 4px 16px #0003}
#brand{position:absolute;top:10px;left:10px;font-weight:bold;font-size:17px}
#stats{position:absolute;top:55px;left:10px;width:155px;font-size:12px}
.bar{height:7px;background:#ffffff30;border-radius:8px;overflow:hidden;margin:5px 0}
.fill{height:100%;width:100%;background:#46df83}
#money{position:absolute;top:10px;right:10px;font-weight:bold;color:#ffe57a}
#place{position:absolute;top:100px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px}
#mission{position:absolute;top:140px;left:50%;transform:translateX(-50%);background:#12271dd9;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
#help{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);font-size:11px;color:white;text-shadow:0 1px 3px #000;white-space:nowrap}
#controls{position:absolute;bottom:18px;left:15px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}
.ctrl{border:1px solid #ffffff70;border-radius:13px;background:#17372dbd;color:white;font-size:20px;touch-action:none;user-select:none}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#actions{position:absolute;bottom:25px;right:14px;display:flex;flex-direction:column;gap:9px;pointer-events:auto}
.action{border:1px solid #ffffff70;border-radius:50%;width:58px;height:58px;background:#17372dc9;color:white;font-weight:bold;font-size:11px;touch-action:none}
#run{background:#bd6c22e8}
#toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:#10251eeb;padding:10px 15px;border-radius:10px;font-size:12px;display:none;text-align:center;max-width:85%}
#maplabel{position:absolute;right:10px;top:60px;font-size:10px;color:#d8ffdc;text-align:right}
@media(min-width:750px){
 #controls{left:28px;bottom:25px;transform:scale(1.1);transform-origin:bottom left}
 #actions{right:28px;bottom:35px}
 #stats{width:180px}
}
</style>
</head>
<body>
<div id="hud">
 <div id="brand" class="panel">🌴 BAYELSA LIFE 3D</div>
 <div id="stats" class="panel">
  <div>👤 Local Player</div>
  <div style="margin-top:8px">⚡ Energy <span id="energyText">100</span>%</div>
  <div class="bar"><div id="energyBar" class="fill"></div></div>
  <div>📍 Yenagoa Explorer</div>
 </div>
 <div id="money" class="panel">₦ <span id="cash">1000</span></div>
 <div id="place" class="panel">📍 Yenagoa Town</div>
 <div id="mission">🎯 Explore your new town!</div>
 <div id="maplabel">BAYELSA STATE<br>EXPLORATION MODE</div>
 <div id="help">Use the controls to explore the town</div>
 <div id="controls">
  <button class="ctrl" id="up">▲</button>
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="down">▼</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div id="actions">
  <button class="action" id="run">RUN</button>
  <button class="action" id="jump">JUMP</button>
  <button class="action" id="interact">LOOK</button>
 </div>
 <div id="toast"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bd4f5);
scene.fog = new THREE.Fog(0x8bd4f5, 65, 180);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';
renderer.domElement.style.inset='0';
renderer.domElement.style.zIndex='0';

scene.add(new THREE.HemisphereLight(0xdaf3ff,0x536442,2.0));
const sun = new THREE.DirectionalLight(0xfff0d1,2.5);
sun.position.set(-35,60,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x70ad59), road=mat(0x424c50), roadEdge=mat(0xc3bda8);
const water=mat(0x279fc5,0.25), white=mat(0xffffff);
const dark=mat(0x292e32), leaf=mat(0x247744), trunk=mat(0x805132);

function block(w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;
 scene.add(o);return o;
}
function ground(w,d,m,x=0,z=0){
 const o=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
 o.rotation.x=-Math.PI/2;o.position.set(x,0,z);o.receiveShadow=true;scene.add(o);return o;
}
ground(240,240,grass);

// River and bridge
ground(20,240,water,-45,0);
ground(23,5,road,-45,8);
block(24,.25,7,roadEdge,-45,.05,8);
for(let z=5;z<12;z+=2)block(.2,.5,.2,white,-56,.2,z);
for(let z=5;z<12;z+=2)block(.2,.5,.2,white,-34,.2,z);

// Roads
function makeRoad(w,d,x,z){
 ground(w+1,d+1,roadEdge,x,z);
 ground(w,d,road,x,z);
 if(w>d){
  for(let xx=x-w/2+2;xx<x+w/2;xx+=5)block(1.2,.025,.12,white,xx,.03,z);
 }else{
  for(let zz=z-d/2+2;zz<z+d/2;zz+=5)block(.12,.025,1.2,white,x,.03,zz);
 }
}
makeRoad(190,9,0,0);
makeRoad(9,170,0,0);
makeRoad(115,8,25,-35);
makeRoad(110,8,20,35);
makeRoad(8,110,35,0);
makeRoad(8,100,-30,0);

// Buildings
const buildingColors=[0xe6b56b,0xe8dfc9,0x8dc3b7,0xd67b59,0xe7d37b,0xa2b6dc,0xc7a4d6];
function building(x,z,w,d,h,color,name){
 block(w,h,d,mat(color),x,0,z);
 block(w+0.35,.4,d+0.35,mat(0x554f4b),x,h,z);
 // front door
 block(w*.18,h*.38,.12,mat(0x533b2b),x,0,z+d/2+.07);
 // windows
 const windowMat=mat(0x83d5eb,0.3);
 for(let y=1.3;y<h-0.2;y+=1.5){
  for(let xx=x-w/2+0.8;xx<x+w/2-0.3;xx+=1.7){
   block(.7,.65,.08,windowMat,xx,y,z+d/2+.09);
  }
 }
 if(name){
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=128;
  const c=canvas.getContext('2d');
  c.fillStyle='#15382a';c.fillRect(0,0,512,128);
  c.fillStyle='#fff2c1';c.font='bold 44px Arial';c.textAlign='center';
  c.fillText(name,256,80);
  const tex=new THREE.CanvasTexture(canvas);
  const sign=new THREE.Mesh(new THREE.PlaneGeometry(w*.9,.8),new THREE.MeshBasicMaterial({map:tex}));
  sign.position.set(x,h*.72,z+d/2+.15);scene.add(sign);
 }
}
building(17,-16,10,8,7,0xdca76c,'');
building(31,-16,10,8,5,0xe7e0c7,'');
building(50,-16,12,9,8,0x82b7a2,'');
building(-16,-17,11,8,6,0xe5d7a6,'');
building(-17,15,12,9,7,0xd88b64,'');
building(16,15,11,8,6,0x9db5dc,'');
building(52,15,12,9,9,0xe5c96c,'');
building(50,51,13,10,8,0xe4b49a,'');
building(20,52,12,10,6,0x9bbfae,'');
building(-20,51,12,10,7,0xc4a0d3,'');
building(-15,-49,15,12,9,0xd8b07a,'');
building(20,-50,13,11,7,0xe6d9c1,'');
building(52,-50,15,11,10,0x9fc5db,'');

// Market stalls
function stall(x,z,color){
 block(4,1.9,3,mat(color),x,0,z);
 block(4.7,.2,3.7,mat(0x3d493b),x,2,z);
 block(4.8,.18,3.8,mat(color),x,2.2,z);
 block(.25,2.2,.25,trunk,x-1.9,0,z-1.4);
 block(.25,2.2,.25,trunk,x+1.9,0,z-1.4);
}
for(let i=0;i<5;i++)stall(-75+i*9,-20,[0xe66d46,0xeca83c,0x59a778,0x5d9cc7,0xc87db2][i]);
for(let i=0;i<4;i++)stall(-72+i*9,-32,[0xe4ae4a,0x5cae77,0xe2765a,0x5d9cc7][i]);
building(-57,-25,18,5,5,0xdda657,'SWALI MARKET');

// Airport-style terminal
building(66,70,22,13,6,0xd9e3dd,'AIRPORT');
block(28,.05,9,road,66,.02,84);
for(let x=54;x<80;x+=4)block(1,.04,.2,white,x,.04,84);

// Park
ground(26,25,mat(0x7fc56b),-73,45);
block(8,.3,8,mat(0x9d9c95),-73,.1,45);
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 block(.5,.35,.5,mat(0x82553a),-73+Math.cos(a)*8,.1,45+Math.sin(a)*8);
}

// Palm trees
function palm(x,z,s=1){
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.4*s,4*s,7),trunk);
 t.position.set(x,2*s,z);t.castShadow=true;scene.add(t);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const fr=new THREE.Mesh(new THREE.ConeGeometry(.55*s,3.2*s,5),leaf);
  fr.position.set(x+Math.cos(a)*1.1*s,4*s,z+Math.sin(a)*1.1*s);
  fr.rotation.z=-Math.cos(a)*.75;
  fr.rotation.x=Math.sin(a)*.75;
  fr.castShadow=true;scene.add(fr);
 }
}
for(let i=0;i<48;i++){
 const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;
 if(Math.abs(x)<12||Math.abs(z)<13||Math.abs(x+45)<12)continue;
 palm(x,z,.7+Math.random()*.5);
}

// Player character
const player=new THREE.Group();scene.add(player);
const skin=mat(0x8a5238), shirt=mat(0x12a66a), trousers=mat(0x243e70), shoes=mat(0x252525);
function part(parent,geo,m,x,y,z){
 const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o;
}
part(player,new THREE.CylinderGeometry(.35,.4,.95,10),shirt,0,1.35,0);
part(player,new THREE.SphereGeometry(.33,16,12),skin,0,2.05,0);
part(player,new THREE.SphereGeometry(.34,12,8),dark,0,2.28,0);
const arms=[],legs=[];
for(const side of [-1,1]){
 const arm=part(player,new THREE.BoxGeometry(.19,.8,.22),shirt,side*.48,1.38,0);
 arms.push(arm);
 const leg=part(player,new THREE.BoxGeometry(.25,.78,.3),trousers,side*.19,.5,0);
 legs.push(leg);
 part(player,new THREE.BoxGeometry(.29,.16,.4),shoes,side*.19,.12,.07);
}
player.position.set(5,0,9);

// Simple distant buildings
for(let i=0;i<36;i++){
 const x=(Math.random()-.5)*210,z=(Math.random()-.5)*210;
 if(Math.abs(x)<70&&Math.abs(z)<70)continue;
 block(4+Math.random()*7,3+Math.random()*8,4+Math.random()*7,
 mat(buildingColors[i%buildingColors.length]),x,0,z);
}

// Input
const keys={};
let running=false,energy=100,cash=1000,jumpV=0,onGround=true,walkCycle=0;
function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});
 const off=e=>{keys[key]=false};
 b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);
 b.addEventListener('lostpointercapture',off);
}
bindButton('up','up');bindButton('down','down');bindButton('left','left');bindButton('right','right');
document.getElementById('run').addEventListener('pointerdown',e=>{e.preventDefault();running=true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('run').addEventListener(ev,()=>running=false));
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();if(onGround){jumpV=7;onGround=false}
});
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 keys[({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'})[k]||k]=true;
 if(k===' '&&onGround){jumpV=7;onGround=false}
 if(k==='shift')running=true;
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 keys[({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'})[k]||k]=false;
 if(k==='shift')running=false;
});

const places=[
 {name:'Town Square',x:5,z:9},
 {name:'Swali Market',x:-57,z:-25},
 {name:'Peace Park',x:-73,z:45},
 {name:'Airport',x:66,z:70},
 {name:'River Waterfront',x:-45,z:-20},
 {name:'Shopping District',x:31,z:-16},
 {name:'Residential Area',x:20,z:52}
];
let currentPlace='';
const toast=document.getElementById('toast');
let toastTimer;
function message(s){
 toast.textContent=s;toast.style.display='block';
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2400);
}
document.getElementById('interact').addEventListener('click',()=>{
 const nearest=places.reduce((a,b)=>Math.hypot(player.position.x-a.x,player.position.z-a.z)<Math.hypot(player.position.x-b.x,player.position.z-b.z)?a:b);
 message('You are exploring '+nearest.name+'. More activities coming soon!');
});
function nearestPlace(){
 let best=places[0],dist=Infinity;
 for(const p of places){
  const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);
  if(d<dist){best=p;dist=d}
 }
 return dist<17?best.name:'Yenagoa Town';
}
const cameraOffset=new THREE.Vector3(0,8,12);
const desiredCamera=new THREE.Vector3();
let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 const forward=(keys.up?1:0)-(keys.down?1:0);
 const side=(keys.right?1:0)-(keys.left?1:0);
 const moving=forward!==0||side!==0;
 const speed=running&&energy>0?10:5.5;
 if(running&&moving)energy=Math.max(0,energy-13*dt);
 else energy=Math.min(100,energy+5*dt);
 if(moving){
  const len=Math.hypot(forward,side);
  const f=forward/len,s=side/len;
  player.position.x+=(s*Math.cos(0)+f*Math.sin(0))*speed*dt;
  player.position.z+=(s*Math.sin(0)-f*Math.cos(0))*speed*dt;
  player.rotation.y=Math.atan2(s,-f);
  walkCycle+=dt*speed*1.6;
  legs[0].rotation.x=Math.sin(walkCycle)*.55;
  legs[1].rotation.x=-Math.sin(walkCycle)*.55;
  arms[0].rotation.x=-Math.sin(walkCycle)*.45;
  arms[1].rotation.x=Math.sin(walkCycle)*.45;
 }else{
  legs.forEach(o=>o.rotation.x*=.8);
  arms.forEach(o=>o.rotation.x*=.8);
 }
 if(!onGround||jumpV>0){
  player.position.y+=jumpV*dt;
  jumpV-=18*dt;
  if(player.position.y<=0){player.position.y=0;jumpV=0;onGround=true}
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-105,105);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-105,105);
 const p=nearestPlace();
 if(p!==currentPlace){currentPlace=p;document.getElementById('place').textContent='📍 '+p}
 document.getElementById('energyText').textContent=Math.round(energy);
 document.getElementById('energyBar').style.width=energy+'%';
 document.getElementById('energyBar').style.background=energy<25?'#ff6c5e':'#46df83';
 desiredCamera.set(player.position.x,player.position.y,player.position.z).add(cameraOffset);
 camera.position.lerp(desiredCamera,1-Math.pow(.001,dt));
 camera.lookAt(player.position.x,player.position.y+1.3,player.position.z);
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
message('Welcome to Bayelsa Life! Explore Yenagoa.');
requestAnimationFrame(animate);
</script>
</body>
</html>
